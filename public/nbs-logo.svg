<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 360" width="100%" height="100%">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;800&amp;family=Cinzel:wght@700&amp;display=swap');
      .nbs-title {
        font-family: 'Cinzel', 'Playfair Display', 'Liberation Serif', Georgia, serif;
        font-weight: 700;
        fill: #204638;
        letter-spacing: 0.5px;
      }
    </style>
  </defs>

  <!-- Green Oval Emblem -->
  <ellipse cx="350" cy="155" rx="225" ry="130" fill="#204638" />

  <!-- The "nbs" lettering inside the oval -->
  <g fill="#FFFFFF">
    <!-- Letter 'n' -->
    <!-- Left vertical bar of n -->
    <path d="M 205 106 L 246 106 L 246 242 L 205 242 Z" />
    <!-- Arch and right vertical bar of n -->
    <path d="M 238 140 C 248 116 270 102 296 102 C 322 102 334 116 334 140 L 334 242 L 295 242 L 295 152 C 295 138 286 132 274 132 C 258 132 247 143 247 160 L 247 242 L 205 242 Z" />

    <!-- Letter 'b' with tall ascender reaching up into the oval -->
    <!-- Ascender and left stem -->
    <path d="M 334 38 L 377 38 L 377 242 L 334 242 Z" />
    <!-- Outer bowl of b -->
    <path d="M 368 104 C 385 102 445 102 445 173 C 445 244 385 244 368 242 Z" />

    <!-- Letter 's' -->
    <path d="M 508 142 C 504 116 482 103 458 103 C 434 103 416 116 416 135 C 416 153 430 162 454 168 L 468 171 C 484 175 494 182 494 194 C 494 207 480 216 462 216 C 440 216 424 204 421 185 L 388 185 C 392 222 422 245 463 245 C 504 245 531 223 531 193 C 531 172 516 160 490 154 L 476 151 C 462 148 452 143 452 133 C 452 122 463 115 478 115 C 492 115 503 123 506 139 Z" />
  </g>

  <!-- Counter cutouts for 'b' and 'n' -->
  <!-- Inner counter of b (cut with background green #204638) -->
  <path d="M 377 134 C 388 134 408 140 408 173 C 408 206 388 212 377 212 Z" fill="#204638" />

  <!-- Official Subtitle: "National Bureau of Statistics" -->
  <text x="350" y="335" text-anchor="middle" font-size="34" class="nbs-title">National Bureau of Statistics</text>
</svg>
